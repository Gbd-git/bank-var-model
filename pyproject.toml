[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rolling-gjr-garch-skewt-var"
version = "0.1.0"
description = "Reproducible rolling GJR-GARCH-skewt bank VaR backtest"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "pandas>=2.1,<3", "arch>=7.2,<8"]

[project.scripts]
gjr-var = "gjr_var.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
